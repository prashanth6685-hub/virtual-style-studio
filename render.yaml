services:
  - type: web
    name: virtual-style-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: pollinations
      # Render free tier allows only ONE Postgres database per account, so the
      # Blueprint no longer provisions one. Paste the External Database URL of
      # your existing Render Postgres here at deploy time (Render will prompt
      # for it). The app creates its own tables alongside anything already there.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
