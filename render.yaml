databases:
  - name: virtual-style-studio-db
    databaseName: vss
    plan: free

services:
  - type: web
    name: virtual-style-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: pollinations
      - key: DATABASE_URL
        fromDatabase:
          name: virtual-style-studio-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
